[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mdcheck"
version = "0.1.0"
description = "A cross-platform CLI utility that recursively scans Markdown files and checks local, file://, HTTP(S), and anchor links."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
mdcheck = "mdcheck.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mdcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: typer/click require calling Option()/Argument() in parameter defaults.
ignore = ["B008"]
